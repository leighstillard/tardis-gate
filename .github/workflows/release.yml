name: release

# Tag vX.Y.Z on main to publish binaries with checksums and a build-provenance
# attestation. Install on a runner host only after `gh attestation verify`.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

# Release tags are immutable (repository ruleset), so a tag has one target;
# runs for a tag queue rather than cancel a publication half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must be vX.Y.Z on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z; refusing to release"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release"
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.releaseVersion=$GITHUB_REF_NAME" \
              -o "dist/tardis_${target%/*}_${target#*/}" ./cmd/tardis
          done
          got=$(dist/tardis_linux_amd64 version)
          test "$got" = "$GITHUB_REF_NAME" || {
            echo "::error::binary reports version $got, want $GITHUB_REF_NAME"
            exit 1
          }
          cd dist && sha256sum tardis_* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tardis_*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag may have moved since this run started; publish only if it
          # still names the commit that was built and that commit is on main.
          git fetch -q --force origin main "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          target=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          test "$target" = "$GITHUB_SHA" || {
            echo "::error::$GITHUB_REF_NAME now points at $target, not the built $GITHUB_SHA; refusing to publish"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is no longer on main; refusing to publish"
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

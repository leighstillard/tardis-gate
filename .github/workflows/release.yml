name: release

# Tag vX.Y.Z on main to publish binaries with checksums and a build-provenance
# attestation. Install on a runner host only after `gh attestation verify`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/tardis_${target%/*}_${target#*/}" ./cmd/tardis
          done
          cd dist && sha256sum tardis_* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tardis_*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
